<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🩵</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();

window.addEventListener("resize", resize);


// 🩵 Kalp matematiği
function heart(t) {

    const x = 16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return {
        x: x,
        y: y
    };
}


let progress = 0;


function draw() {

    // EKRANI TAMAMEN TEMİZLE
    // Böylece eski kırmızı çizgiler kalmaz.
    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Siyah arka plan
    ctx.fillStyle = "#000000";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const scale =
        Math.min(
            canvas.width,
            canvas.height
        ) / 45;


    const centerX =
        canvas.width / 2;

    const centerY =
        canvas.height / 2;


    // Çizgiler
    for (let i = 0; i < 180; i++) {

        if (i > progress) {
            continue;
        }


        const angle =
            (Math.PI * 2 * i) / 180;


        const h =
            heart(angle);


        // Kalbin üzerindeki nokta
        const heartX =
            centerX + h.x * scale;

        const heartY =
            centerY - h.y * scale;


        // Dış noktayı belirle
        const length =
            1.25 +
            0.45 *
            Math.sin(i * 0.15);


        const startX =
            centerX +
            h.x *
            scale *
            length;


        const startY =
            centerY -
            h.y *
            scale *
            length;


        // 🩵 SADECE MAVİ RENKLER
        const gradient =
            ctx.createLinearGradient(
                startX,
                startY,
                heartX,
                heartY
            );


        gradient.addColorStop(
            0,
            "rgba(40, 140, 255, 0.15)"
        );


        gradient.addColorStop(
            0.5,
            "rgba(80, 190, 255, 0.7)"
        );


        gradient.addColorStop(
            1,
            "rgba(190, 245, 255, 1)"
        );


        ctx.strokeStyle =
            gradient;


        ctx.lineWidth = 1.3;


        ctx.beginPath();

        ctx.moveTo(
            startX,
            startY
        );

        ctx.lineTo(
            heartX,
            heartY
        );

        ctx.stroke();
    }


    // Çizim animasyonu
    progress += 0.8;


    if (progress > 180) {
        progress = 180;
    }


    requestAnimationFrame(draw);
}


draw();

</script>

</body>
</html>
