
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>❤️</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #ffe6f0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .kalp {
            font-size: 120px;
            animation: buyu 1s infinite alternate;
        }

        @keyframes buyu {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.3);
            }
        }
    </style>
</head>

<body>

    <div class="kalp">❤️</div>

</body>
</html>
