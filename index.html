<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>❤️</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
    }

    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);

function heart(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return {x, y};
}

let progress = 0;

function draw() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const scale = Math.min(canvas.width, canvas.height) / 45;

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    for (let i = 0; i < 180; i++) {

        if (i > progress) continue;

        const a = (Math.PI * 2 * i) / 180;

        const h = heart(a);

        const hx = cx + h.x * scale;
        const hy = cy - h.y * scale;

        const length =
            1.25 + 0.45 * Math.sin(i * 0.15);

        const sx = cx + h.x * scale * length;
        const sy = cy - h.y * scale * length;

        const gradient = ctx.createLinearGradient(
            sx, sy, hx, hy
        );

     gradient.addColorStop(0, "rgba(80, 180, 255, 0.1)");
gradient.addColorStop(0.5, "rgba(80, 200, 255, 0.7)");
gradient.addColorStop(1, "rgba(150, 230, 255, 1)");

        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(hx, hy);
        ctx.stroke();
    }

    progress += 0.8;

    if (progress > 180) {
        progress = 180;
    }

    requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
