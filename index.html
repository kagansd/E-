<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>❤️</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #ffe6f0;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        svg {
            width: 300px;
            height: 300px;
        }

        .kalp {
            fill: none;
            stroke: red;
            stroke-width: 5;

            stroke-linecap: round;
            stroke-linejoin: round;

            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;

            animation: ciz 3s ease forwards;
        }

        @keyframes ciz {
            to {
                stroke-dashoffset: 0;
            }
        }
    </style>
</head>

<body>

    <svg viewBox="0 0 300 300">

        <path
            class="kalp"
            d="M150 250
               C130 230 50 180 50 110
               C50 50 120 40 150 90
               C180 40 250 50 250 110
               C250 180 170 230 150 250 Z"
        />

    </svg>

</body>
</html>
