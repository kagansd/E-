<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>⭐</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #fff4b8;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        svg {
            width: 350px;
            height: 350px;
        }

        /* Yıldızın çizilmesi */
        .yildiz {
            fill: none;
            stroke: #f5b400;
            stroke-width: 6;
            stroke-linecap: round;
            stroke-linejoin: round;

            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;

            animation: ciz 3s ease forwards;
        }

        /* E harfi */
        .harf {
            font-family: Arial, sans-serif;
            font-size: 55px;
            font-weight: bold;
            fill: #f5b400;
            text-anchor: middle;
            dominant-baseline: middle;

            opacity: 0;
            animation: gorun 1s ease forwards;
            animation-delay: 3s;
        }

        @keyframes ciz {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes gorun {
            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

<svg viewBox="0 0 350 350">

    <!-- Yıldız -->
    <polygon
        class="yildiz"
        points="
        175,35
        207,125
        305,125
        226,182
        256,275
        175,220
        94,275
        124,182
        45,125
        143,125
        "
    />

    <!-- Yıldızın içindeki E -->
    <text class="harf" x="175" y="155">E</text>

</svg>

</body>
</html>
